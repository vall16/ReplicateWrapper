
services:
  db:
    image: mysql:8
    container_name: repli-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: vibe2025
      MYSQL_DATABASE: repli_db
      MYSQL_USER: trader
      MYSQL_PASSWORD: vibe2025
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - repli-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repli-backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend:/app
    networks:
      - repli-network
      - shared-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repli-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    environment:
      - WEB_CONCURRENCY=1
    networks:
      - repli-network
      - shared-net
    restart: unless-stopped

networks:
  repli-network:
    driver: bridge
  shared-net:
    external: true

volumes:
  db_data:
# docker-compose allineato a quello del server, da lanciare solo in prod non in dev